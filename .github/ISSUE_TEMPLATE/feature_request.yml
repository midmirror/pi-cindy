name: Feature request
description: 建议新功能或改进
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先搜现有 issue 避免重复。协议/契约类改动请先读 `docs/DESIGN.md` 与参考仓
        [makecindy/cindy](https://github.com/makecindy/cindy) 对应实现——本仓模拟 Desktop 被控端，
        不主动偏离上游契约。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 动机
      description: 你遇到什么问题，想解决什么
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 具体想要什么能力，交互如何
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他做法，及为何不可行
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 纯扩展侧（不涉及协议）
        - 协议/契约变更（需对照上游）
        - 手机端联动（需真机验证）
    validations:
      required: true

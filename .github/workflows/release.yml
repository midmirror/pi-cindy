name: Release

# 打 v* tag 即自动发布 npm 并创建 GitHub Release，notes 从 docs/CHANGELOG.md 对应版本条目提取。
# 前置条件：repo secret `NPM_TOKEN`（npm granular access token，需 publish 权限 + bypass 2FA；
# 过期后更新 secret 即可，workflow 本身无需改动）。
# 发版流程：改 CHANGELOG → bump package.json version → git tag vX.Y.Z → push tag。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Verify version matches tag
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "v$PKG_VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version $PKG_VER != tag $GITHUB_REF_NAME，publish 中止" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish  # prepublishOnly 门禁：build + test + typecheck
      - name: Extract changelog notes
        run: |
          python3 - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          tag = sys.argv[1].lstrip('v')
          txt = open('docs/CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## \[{re.escape(tag)}\]\s.*?$(.*?)(?=^## |\Z)', txt, re.M | re.S)
          print(m.group(1).strip() if m else 'No changelog entry found for this version.')
          PY
          echo "--- extracted notes ---"
          head -8 notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
